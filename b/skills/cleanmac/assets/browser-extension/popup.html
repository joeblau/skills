<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CleanMac Browser Companion</title>
<style>body{font:14px system-ui;min-width:300px;padding:16px}input,button{font:inherit;margin:8px 0;padding:6px}label{display:block}output{display:block;white-space:pre-wrap}</style></head>
<body><h1>CleanMac</h1><p>Connect this profile for local tab review and approved cleanup. Private tabs are excluded.</p>
<label>Profile label <input id="label" maxlength="80" placeholder="Personal Chrome"></label>
<button id="connect">Connect</button> <button id="disconnect">Disconnect</button>
<p>Extension ID: <code id="extension"></code></p><output id="status" aria-live="polite"></output>
<script src="popup.js"></script></body></html>
